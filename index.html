<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>Dream Catalogue v0.2.8.1</title>
  <meta name="theme-color" content="#e6e3ea" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Dream Catalogue" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="titleblock"><h1>Dream Catalogue</h1><p>optical phenomena for photographs</p></div>
      <div class="top-actions">
        <button id="openBtn" class="btn">OPEN</button>
        <button id="mutateBtn" class="btn strong">MUTATE</button>
        <button id="saveBtn" class="btn">SAVE</button>
      </div>
    </header>
    <main class="main">
      <section class="canvas-panel"><div id="canvasWrap" class="canvas-wrap"></div><input id="photoInput" type="file" accept="image/*" hidden /></section>
      <section class="control-panel">
        <nav class="mode-nav" id="modeNav">
          <button class="mode-btn active" data-mode="HALO">HALO</button>
          <button class="mode-btn" data-mode="PRISM">PRISM</button>
          <button class="mode-btn" data-mode="SMOKE">SMOKE</button>
          <button class="mode-btn" data-mode="VEIL">VEIL</button>
        </nav>
        <div class="sliders">
          <label class="slider-row"><span>INTENSITY</span><input id="intensitySlider" type="range" min="0" max="100" value="68" /><strong id="intensityValue">68</strong></label>
          <label class="slider-row"><span>SOURCE COLOR</span><input id="sourceSlider" type="range" min="0" max="100" value="40" /><strong id="sourceValue">40</strong></label>
        </div>
      </section>
    </main>
  </div>
  <script src="sketch.js"></script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}</script>
</body>
</html>
